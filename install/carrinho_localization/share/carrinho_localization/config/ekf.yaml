### ekf config file ###
ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_acceleration: false     # não precisamos disso pro Nav2, simplifica
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom                # continua "odom" -- esse EKF só cuida do local

    odom0: /wheel_odom                # CORRIGIDO: nome certo do seu tópico
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # só vx (seu encoder real)
                   false, false, false,   # vyaw = false (removido -- não é medido pelo encoder)
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /bno055/imu
    imu0_config: [false, false, false,
                  false, false, true,     # yaw
                  false, false, false,
                  false, false, true,     # vyaw
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10

    # pose0 REMOVIDO -- o slam_toolbox cuida do map -> odom sozinho